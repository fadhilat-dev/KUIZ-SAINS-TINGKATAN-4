name: Kemas Kini Senarai Kuiz

on:
  push:
    branches: [main]
    paths:
      - '**/*.html'
      - '.github/workflows/senarai-kuiz.yml'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: senarai-kuiz
  cancel-in-progress: false

jobs:
  kemas-kini:
    runs-on: ubuntu-latest
    steps:
      - name: Ambil fail repositori
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Jana senarai kuiz
        run: |
          python3 - <<'PY'
          import os
          import re
          import subprocess
          from datetime import datetime, timedelta, timezone
          from pathlib import Path
          from urllib.parse import quote

          owner, repo = os.environ['GITHUB_REPOSITORY'].split('/', 1)
          base = f'https://{owner}.github.io/{repo}/'
          start = '<!-- AUTO-QUIZ:START -->'
          end = '<!-- AUTO-QUIZ:END -->'
          msia = timezone(timedelta(hours=8))
          months = ['', 'Jan', 'Feb', 'Mac', 'Apr', 'Mei', 'Jun',
                    'Jul', 'Ogos', 'Sep', 'Okt', 'Nov', 'Dis']

          def quiz_name(path):
              name = re.sub(r'[-_]+', ' ', path.stem).strip()
              match = re.fullmatch(r'(.+?)\s+(\d+)', name)
              if match:
                  return f'{match.group(1)} (Set {match.group(2)})'
              return name

          def updated_at(path):
              result = subprocess.run(
                  ['git', 'log', '-1', '--format=%ct', '--', str(path)],
                  capture_output=True, text=True, check=True
              ).stdout.strip()
              return int(result) if result else 0

          quizzes = []
          for path in Path('.').rglob('*.html'):
              if path.name.lower() in ('index.html', '404.html'):
                  continue
              if any(part.startswith('.') for part in path.parts):
                  continue
              quizzes.append((updated_at(path), path))

          quizzes.sort(key=lambda item: (item[0], item[1].as_posix()),
                       reverse=True)

          lines = [
              start,
              '## 📚 Senarai Kuiz',
              f'**{len(quizzes)} kuiz** — dikemas kini secara automatik apabila kuiz ditambah atau diubah.',
              'Kuiz yang paling baharu dikemas kini dipaparkan dahulu.',
              ''
          ]
          for timestamp, path in quizzes:
              url = base + quote(path.as_posix(), safe='/')
              when = ''
              if timestamp:
                  d = datetime.fromtimestamp(timestamp, msia)
                  when = f' — dikemas kini {d.day} {months[d.month]} {d.year}'
              lines.append(f'- [{quiz_name(path)}]({url}){when}')

          if not quizzes:
              lines.append('Belum ada kuiz. Tambahkan fail HTML untuk memulakan senarai.')
          lines += ['', '_Senarai dijana oleh GitHub Actions._', end]
          generated = '\n'.join(lines)

          readme_path = Path('README.md')
          old = (readme_path.read_text(encoding='utf-8')
                 if readme_path.exists() else '')
          if start in old and end in old:
              before = old.split(start, 1)[0].rstrip()
              after = old.split(end, 1)[1].lstrip('\n')
              new = (before + '\n\n' if before else '') + generated + '\n' + after
          else:
              intro = old.rstrip() if old.strip() else (
                  '# 🔬 Senarai Kuiz\n\n'
                  'Kuiz Sains Tingkatan 4 untuk latihan dan ulang kaji.'
              )
              new = intro + '\n\n' + generated + '\n'

          readme_path.write_text(new, encoding='utf-8')
          PY

      - name: Simpan perubahan README
        run: |
          git add README.md
          if git diff --cached --quiet; then
            echo 'Tiada perubahan pada senarai.'
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'Kemas kini senarai kuiz secara automatik'
          git push
